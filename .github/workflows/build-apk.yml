name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add location permissions
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          add = ('<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
                 '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
                 '    <uses-feature android:name="android.hardware.location.gps" />\n'
                 '    ')
          assert '<application' in s, 'application tag not found'
          s = s.replace('<application', add + '<application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fieldmap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
